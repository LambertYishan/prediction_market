<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenForecast</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Chart.js (must load first) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Chart.js zoom/pan plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

  <!-- Date adapter (must load after Chart.js) -->
  <script
    src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

</head>

<body>
  <header>
    <h1 class="brand-title">OpenForecast</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="admin.html">Admin</a>
      <a id="login-link" href="login.html">Login / Register</a>
      <a href="portal.html" id="portal-link" class="hidden">My Portal</a>
      <a id="logout-link" href="#" class="hidden">Logout</a>
      <span id="user-greeting" class="hidden"></span>
    </nav>
  </header>

  <main>
    <section id="market-container">
      <!-- Market details injected here -->
    </section>

    <!-- Countdown Timer -->
    <section id="countdown-section" class="hidden">
      <h3>Time Remaining:</h3>
      <p id="countdown-timer" class="countdown"></p>
      <div id="timezones" class="tz-display"></div>
    </section>

    <!-- Time Progress Chart -->
    <section id="progress-chart-section" class="hidden">
      <h3>Market Progress Over Time</h3>
      <div class="chart-controls">
        <button id="progress-zoom-in" class="btn-secondary">Zoom In</button>
        <button id="progress-zoom-out" class="btn-secondary">Zoom Out</button>
        <button id="progress-zoom-reset" class="btn-secondary">Reset</button>
        <span class="chart-hint">Scroll to zoom, drag to pan</span>
      </div>
      <canvas id="progressChart" width="400" height="200"></canvas>
    </section>

    <!-- Leaderboard Section -->
    <section id="leaderboard-section" class="hidden">
      <h3>Leaderboard</h3>
      <table id="leaderboard-table">
        <thead>
          <tr>
            <th>User</th>
            <th>YES Shares</th>
            <th>NO Shares</th>
            <th>Spent ($)</th>
            <th>Avg Price/Share ($)</th>
            <th>Payout / PnL ($)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Bet Section -->
    <section id="bet-container" class="hidden">
      <div class="section-header">
        <h2>Place a Bet</h2>
        <span class="badge">Buy / Sell</span>
      </div>
      <div id="bet-message" class="muted"></div>
      <form id="bet-form" class="order-form">
        <div class="order-grid">
          <label class="form-field">
            <span>Amount (shares)</span>
            <input type="number" id="bet-amount" name="amount" step="0.01" min="0.01" required>
          </label>
          <label class="form-field">
            <span>Side</span>
            <div class="pill-group">
              <label class="pill"><input type="radio" name="side" value="YES" checked> YES</label>
              <label class="pill"><input type="radio" name="side" value="NO"> NO</label>
            </div>
          </label>
        </div>
        <div class="button-row">
          <button type="submit">Place Bet</button>
          <button type="button" class="btn-secondary" onclick="sellPosition('YES')">Sell YES</button>
          <button type="button" class="btn-secondary" onclick="sellPosition('NO')">Sell NO</button>
        </div>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      updateUserGreeting();
      const market = await loadMarketDetails();
      console.log("Loaded market:", market);
      console.log("Expires_at:", market?.expires_at);

      // Countdown setup
      if (market && market.expires_at) {
        const countdownSection = document.getElementById('countdown-section');
        countdownSection.classList.remove('hidden');
        const endTime = parseUtc(market.expires_at);
        const timerEl = document.getElementById('countdown-timer');
        const tzEl = document.getElementById('timezones');

        const updateTimer = () => {
          const diff = endTime - new Date();
          if (diff <= 0) {
            timerEl.textContent = "Market closed";
            clearInterval(timer);
            return;
          }
          const hrs = Math.floor(diff / 1000 / 60 / 60);
          const mins = Math.floor((diff / 1000 / 60) % 60);
          const secs = Math.floor((diff / 1000) % 60);
          timerEl.textContent = `${hrs}h ${mins}m ${secs}s`;
        };
        updateTimer();
        const timer = setInterval(updateTimer, 1000);

        // 🌍 Show absolute expiration times in multiple zones
        const timeOptions = { dateStyle: 'full', timeStyle: 'long' };
        const timeStrings = [
          { label: 'New York (EST)', tz: 'America/New_York' },
          { label: 'London (GMT)', tz: 'Europe/London' },
          { label: 'Beijing (UTC+8)', tz: 'Asia/Shanghai' },
          { label: 'Tokyo (JST)', tz: 'Asia/Tokyo' },
        ].map(t =>
          `<p><strong>${t.label}:</strong> ${endTime.toLocaleString('en-US', { ...timeOptions, timeZone: t.tz })}</p>`
        ).join('');
        tzEl.innerHTML = timeStrings;
      }

      // Chart setup (progress only)
      if (market) {
        try {
          const resp = await fetch(`${apiBase}/markets/${market.id}/history`);
          const history = await resp.json();

          // ==================== Time Progress Chart ====================
          const progressSection = document.getElementById('progress-chart-section');
          progressSection.classList.remove('hidden');
          const progressCtx = document.getElementById('progressChart').getContext('2d');

          // Ensure market has created_at and expires_at
          if (market.created_at && market.expires_at) {
            const startTime = parseUtc(market.created_at);
            const endTime = parseUtc(market.expires_at);

            // Build stepped series: horizontal when flat, vertical spike on change.
            const buildSteppedSeries = (points, key) => {
              const sorted = (points || [])
                .slice()
                .sort((a, b) => parseUtc(a.timestamp) - parseUtc(b.timestamp));

              const series = [];
              const now = new Date();

              if (sorted.length === 0) {
                const baseline = 0.5;
                series.push({ x: startTime, y: baseline });
                series.push({ x: now < endTime ? now : endTime, y: baseline });
                return series;
              }

              sorted.forEach((p, idx) => {
                const t = parseUtc(p.timestamp);
                const y = p[key];
                if (idx === 0 && startTime && startTime < t) {
                  series.push({ x: startTime, y });
                }
                series.push({ x: t, y });
              });

              const last = series[series.length - 1];
              const tailX = now < endTime ? now : endTime;
              if (tailX > last.x) series.push({ x: tailX, y: last.y });
              if (endTime > tailX) series.push({ x: endTime, y: last.y });
              return series;
            };

            const yesSeries = buildSteppedSeries(history, 'price_yes');
            const noSeries = buildSteppedSeries(history, 'price_no');

            const progressChart = new Chart(progressCtx, {
              type: 'line',
              data: {
                datasets: [
                  {
                    label: 'YES Price',
                    data: yesSeries,
                    borderColor: 'green',
                    tension: 0,
                    stepped: 'before',
                    pointRadius: 0,
                    fill: false
                  },
                  {
                    label: 'NO Price',
                    data: noSeries,
                    borderColor: 'red',
                    tension: 0,
                    stepped: 'before',
                    pointRadius: 0,
                    fill: false
                  }
                ]
              },
              options: {
                animation: false,
                plugins: {
                  legend: { position: 'bottom' },
                  zoom: {
                    limits: {
                      x: { min: startTime, max: endTime }
                    },
                    pan: {
                      enabled: true,
                      mode: 'x'
                    },
                    zoom: {
                      wheel: { enabled: true },
                      pinch: { enabled: true },
                      mode: 'x'
                    }
                  }
                },
                scales: {
                  x: {
                    type: 'time',
                    time: {
                      displayFormats: {
                        hour: 'MMM d, HH:mm',
                        day: 'MMM d'
                      },
                      tooltipFormat: 'MMM d, yyyy HH:mm:ss',
                      minUnit: 'minute'
                    },
                    title: {
                      display: true,
                      text: 'Timestamp'
                    },
                    min: startTime,
                    max: endTime
                  },
                  y: {
                    min: 0,
                    max: 1,
                    title: {
                      display: true,
                      text: 'Price (0-1)'
                    }
                  }
                }
              }
            });

            // Live update every 10 seconds until expiry
            const updater = setInterval(() => {
              const now = new Date();
              if (now >= endTime) {
                clearInterval(updater);
                return;
              }
              const yes = buildSteppedSeries(history, 'price_yes');
              const no = buildSteppedSeries(history, 'price_no');
              progressChart.data.datasets[0].data = yes;
              progressChart.data.datasets[1].data = no;
              progressChart.update();
            }, 10000);

            // Hook up zoom controls
            const zoomInBtn = document.getElementById('progress-zoom-in');
            const zoomOutBtn = document.getElementById('progress-zoom-out');
            const zoomResetBtn = document.getElementById('progress-zoom-reset');
            if (zoomInBtn) zoomInBtn.onclick = () => progressChart.zoom(1.2);
            if (zoomOutBtn) zoomOutBtn.onclick = () => progressChart.zoom(0.8);
            if (zoomResetBtn) zoomResetBtn.onclick = () => progressChart.resetZoom();
            // Adaptive unit: toggle day scale when zoomed out past 48h
            progressChart.options.scales.x.ticks.callback = function(value) {
              const rangeMs = progressChart.scales.x.max - progressChart.scales.x.min;
              const twoDaysMs = 48 * 60 * 60 * 1000;
              if (rangeMs > twoDaysMs) {
                progressChart.options.scales.x.time.unit = 'day';
              } else {
                progressChart.options.scales.x.time.unit = 'hour';
              }
              return this.getLabelForValue(value);
            };
            progressChart.update();
          }
        } catch (err) {
          console.error("Failed to load price history:", err);
        }

        // ✅ Load leaderboard once market is known
        await loadLeaderboard(market.id);
      }
    });

    // Leaderboard rendering
    async function loadLeaderboard(marketId) {
      const section = document.getElementById("leaderboard-section");
      const tbody = section.querySelector("tbody");
      section.classList.remove("hidden");

      try {
        const res = await fetch(`${apiBase}/markets/${marketId}/leaderboard`);
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = "<tr><td colspan='5'>No participants yet.</td></tr>";
          return;
        }

        tbody.innerHTML = data.map(row => `
          <tr>
            <td>${row.username}</td>
            <td>${row.yes_shares}</td>
            <td>${row.no_shares}</td>
            <td>${parseFloat(row.spent).toFixed(2)}</td>
            <td>${(row.avg_price_yes ?? row.avg_price_no ?? 0).toFixed(3)}</td>
            <td>${row.payout >= 0 ? "+" + row.payout.toFixed(2) : row.payout.toFixed(2)}</td>
          </tr>
        `).join("");
      } catch (err) {
        console.error("Failed to load leaderboard:", err);
        tbody.innerHTML = "<tr><td colspan='5'>Error loading leaderboard.</td></tr>";
      }
    }
  </script>
</body>

</html>
